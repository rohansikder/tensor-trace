[package]
name = "tensor-trace-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local API and command-line tools for TensorTrace"

[[bin]]
name = "tensor-trace"
path = "src/main.rs"

[dependencies]
tensor-trace-engine = { path = "../engine" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
