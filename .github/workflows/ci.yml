name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and numerical correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit and API tests
        run: cargo test --workspace --locked
      - name: Build the runtime
        run: cargo build --release --locked
      - name: Install independent reference dependencies
        run: python -m pip install -r validation/requirements.txt
      - name: Check the reference implementation
        run: python -m unittest discover -s validation -p 'test_*.py'
      - name: Validate against the independent reference
        run: python validation/check.py
      - name: Fetch and verify the pretrained checkpoint
        run: python scripts/fetch_model.py
      - name: Validate the pretrained checkpoint
        run: python validation/check.py --model models/stories15M.bin --tokenizer models/tokenizer.bin --output build/pretrained-numeric-validation.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the console for browser verification
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Install browser verification dependencies
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Start ready and unavailable runtimes
        run: |
          target/release/tensor-trace serve > build/browser-server.log 2>&1 &
          target/release/tensor-trace --model build/intentionally-missing-model.bin serve --port 8788 > build/unavailable-server.log 2>&1 &
      - name: Verify the complete browser flow
        run: python scripts/browser_check.py --unavailable-url http://127.0.0.1:8788
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: numeric-validation
          path: build/*validation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          path: |
            build/browser-verification.json
            build/screenshots/
            build/*server.log
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web console
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
